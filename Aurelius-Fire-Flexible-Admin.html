// RRFSO 2005, PAS 79-1:2020, Article 9 Compliant

  sleepingAccommodation: boolean;

  accessInstructions: string;

}

// ── ENQUIRY / QUOTATION / JOB ───────────────────────
export interface Enquiry extends AuditMeta, SoftDelete {
  id: string;
  clientId: string;
  premisesId: string | null;
  status: RecordStatus;
  source: 'portal' | 'phone' | 'referral' | 'admin_created';
  type: 'new_fra' | 'review_fra' | 'other';
  fraStatus: FRAStatus;
  assignedAssessorId: string | null;
  requiredByDate: string | null;
  enquiryNotes: string;
  quotationId: string | null;
}

export interface Quotation extends AuditMeta, SoftDelete {
  id: string;
  enquiryId: string;
  clientId: string;
  status: RecordStatus;
  quoteNumber: string;            // AF-Q-2025-0001
  lineItems: { description: string; qty: number; unitPrice: number; vatRate: number }[];
  subtotal: number;
  vatTotal: number;
  total: number;
  validUntil: string;
  paymentStatus: PaymentStatus;
  paymentTermsDays: number;
  acceptedAt: string | null;
  acceptedBy: string | null;
  portalVisible: boolean;
}

export interface Job extends AuditMeta, SoftDelete {
  id: string;                     // Assessment Job
  enquiryId: string;
  quotationId: string | null;
  clientId: string;
  premisesId: string;
  status: RecordStatus;
  fraStatus: FRAStatus;
  assessorId: string | null;
  qaReviewerId: string | null;
  scheduledVisitAt: string | null;
  visitCompletedAt: string | null;
  reportIssuedAt: string | null;
  pas79Compliance: 'PAS 79-1:2020';
  significantFindingsCount: number;
  riskRatingOverall: RiskRating | null;
  reviewDate: string | null;      // Article 9(3) RRFSO
  portalContentOverrides?: Record<string, string>;
}

// ── DOCUMENT ────────────────────────────────────────
export interface Document extends AuditMeta, SoftDelete {
  id: string;
  status: RecordStatus;
  entityType: 'client' | 'premises' | 'enquiry' | 'quotation' | 'job' | 'questionnaire';
  entityId: string;
  fileName: string;
  originalName: string;
  mimeType: string;
  sizeBytes: number;

  checksumSha256: string;
  category: 'fra_report' | 'photo_evidence' | 'floor_plan' | 'quotation' | 'invoice' | 'other';
  portalVisible: boolean;
  version: number;
  previousVersionId: string | null;
}

// ── QUESTIONNAIRE ENGINE ────────────────────────────
export interface QuestionnaireSection extends AuditMeta, SoftDelete {
  id: string;
  jobId: string;
  status: RecordStatus;
  order: number;
  pas79Clause: string;            // e.g. "PAS 79-1:2020 Clause 12 - Means of Escape"
  title: string;
  instruction: string;            // Admin editable
  portalLabel: string;
  required: boolean;
}

export interface QuestionnaireQuestion extends AuditMeta, SoftDelete {
  id: string;
  sectionId: string;
  status: RecordStatus;
  order: number;
  type: 'boolean' | 'risk_rating' | 'text' | 'photo' | 'multi_select' | 'date';
  pas79Reference: string | null;
  labelAdmin: string;
  labelPortal: string;
  instruction: string;
  options?: { value: string; label: string; triggersFinding?: boolean }[];
  required: boolean;
  evidenceRequired: boolean;
  findingTemplate: string | null; // Auto-generates Article 9 finding
}

export interface QuestionnaireAnswer extends AuditMeta {
  id: string;
  questionId: string;
  jobId: string;
  value: any;
  findingRaised: boolean;
  findingText: string | null;
  riskRating: RiskRating | null;
  photos: string[]; // document ids
}

// ── USER & ACCESS ───────────────────────────────────
export interface User extends AuditMeta, SoftDelete {
  id: string;
  status: RecordStatus;
  role: 'super_admin' | 'admin' | 'assessor' | 'qa_reviewer' | 'client_contact';
  email: string;
  displayName: string;
  clientId: string | null;        // For client portal users
  permissions: string[];          // Granular: 'client:write', 'job:archive', etc.
  mfaEnabled: boolean;
  lastLoginAt: string | null;
  suspendedReason: string | null;
}

export interface Address {
  line1: string; line2?: string; city: string; county?: string; postcode: string; country: string;
}

// ── SETTINGS ────────────────────────────────────────
export interface SystemSettings extends AuditMeta {
  id: 'global';
  portalLabels: Record<string, string>;
  workflowStages: { key: FRAStatus; label: string; color: string; order: number }[];
  emailTemplates: { key: string; subject: string; bodyHtml: string; bodyText: string }[];
  notificationRules: { trigger: string; recipients: string[]; templateKey: string; enabled: boolean }[];
  questionnaireDefaults: { version: string; sections: string[] };
}

// Full audit trail: who changed what, when, before/after
// Immutable log, Article 9 traceability

import type { Request, Response, NextFunction } from 'express';
import { randomUUID } from 'crypto';

export interface AuditLogEntry {
  id: string;
  timestamp: string;
  actorId: string;
  actorRole: string;
  actorIp: string;
  action: 'create' | 'update' | 'archive' | 'restore' | 'soft_delete' | 'permanent_delete' | 'document_upload' | 'document_replace' | 'settings_change' | 'permission_change' | 'login' | 'reactivate';
  entityType: string;
  entityId: string;
  before: any | null;            // Snapshot before change
  after: any | null;             // Snapshot after change
  diff: Record<string, { from: any; to: any }> | null;
  metadata: {
    userAgent?: string;
    reason?: string;             // For archive/delete justification
    legalHold?: boolean;
    portalVisibleChange?: boolean;
  };
}

const auditStore: AuditLogEntry[] = []; // Replace with data/audit.json or DB

function deepDiff(before: any, after: any): Record<string, { from: any; to: any }> | null {
  if (!before || !after) return null;
  const diff: Record<string, { from: any; to: any }> = {};
  const keys = new Set([...Object.keys(before), ...Object.keys(after)]);
  for (const k of keys) {
    if (['updatedAt','updatedBy','version'].includes(k)) continue;
    if (JSON.stringify(before[k]) !== JSON.stringify(after[k])) {
      diff[k] = { from: before[k], to: after[k] };
    }
  }
  return Object.keys(diff).length ? diff : null;
}

export function createAuditEntry(req: Request, params: {
  action: AuditLogEntry['action'];
  entityType: string;
  entityId: string;
  before: any | null;
  after: any | null;
  reason?: string;
}): AuditLogEntry {
  return {
    id: randomUUID(),
    timestamp: new Date().toISOString(),
    actorId: (req as any).user?.id || 'system',
    actorRole: (req as any).user?.role || 'system',
    actorIp: req.ip || req.socket.remoteAddress || 'unknown',
    action: params.action,
    entityType: params.entityType,
    entityId: params.entityId,
    before: params.before ? structuredClone(params.before) : null,
    after: params.after ? structuredClone(params.after) : null,
    diff: params.before && params.after ? deepDiff(params.before, params.after) : null,
    metadata: {
      userAgent: req.headers['user-agent'],
      reason: params.reason,
      legalHold: (params.after || params.before)?.legalHold || false,
    }
  };
}

export function auditMiddleware(entityType: string) {
  return (req: Request, _res: Response, next: NextFunction) => {
    // Attach helper to request
    (req as any).audit = (action: AuditLogEntry['action'], entityId: string, before: any, after: any, reason?: string) => {
      const entry = createAuditEntry(req, { action, entityType, entityId, before, after, reason });
      auditStore.push(entry);
      // Persist to data/audit.json in production
      // appendToFile('data/audit.json', entry);
      console.log(\`[AUDIT] \${action} \${entityType}:\${entityId} by \${entry.actorId}\`);
      return entry;
    };
    next();
  };
}

// Query helper for admin UI
export function queryAuditLog(filters: {
  entityType?: string;
  entityId?: string;
  actorId?: string;
  action?: string;
  from?: string;
  to?: string;
  limit?: number;
}) {
  let results = [...auditStore];
  if (filters.entityType) results = results.filter(e => e.entityType === filters.entityType);
  if (filters.entityId) results = results.filter(e => e.entityId === filters.entityId);
  if (filters.action) results = results.filter(e => e.action === filters.action);
  if (filters.from) results = results.filter(e => e.timestamp >= filters.from!);
  if (filters.to) results = results.filter(e => e.timestamp <= filters.to!);
  return results.sort((a,b) => b.timestamp.localeCompare(a.timestamp)).slice(0, filters.limit || 100);
}

  });

  // CREATE - fully flexible, any valid field
  r.post('/', (req, res) => {
    const now = new Date().toISOString();
    const entity = {
      id: randomUUID(),
      ...req.body,               // Admin can set any field - intentional flexible control
      status: req.body.status || 'active',
      deletedAt: null,
      deletedBy: null,
      createdAt: now,
      createdBy: (req as any).user?.id,
      updatedAt: now,
      updatedBy: (req as any).user?.id,
      version: 1,
    };
    store.push(entity);
    (req as any).audit('create', entity.id, null, entity);
    res.status(201).json(entity);
  });

  // UPDATE - PATCH for partial, PUT for full replace (admin flexible)
  r.patch('/:id', (req, res) => {
    const existing = getById(req.params.id);
    if (!existing || existing.deletedAt) return res.status(404).json({ error: 'Not found or deleted' });
    if (existing.status === 'archived' && req.body.status !== 'active') {
      // Allow only reactivation when archived
      return res.status(400).json({ error: 'Record archived. Use /restore to reactivate.' });
    }
    const before = structuredClone(existing);
    Object.assign(existing, req.body, {
      updatedAt: new Date().toISOString(),
      updatedBy: (req as any).user?.id,
      version: existing.version + 1,
    });
    (req as any).audit('update', existing.id, before, existing, req.body._reason);
    res.json(existing);
  });

  // AMEND - explicit amendment endpoint for FRA workflow (PAS 79-1:2020)
  r.post('/:id/amend', (req, res) => {
    const existing = getById(req.params.id);
    if (!existing) return res.status(404).json({ error: 'Not found' });
    const before = structuredClone(existing);
    const amendment = {
      id: randomUUID(),
      parentId: existing.id,
      amendedAt: new Date().toISOString(),
      amendedBy: (req as any).user?.id,
      reason: req.body.reason,   // Required: legal justification for amendment
      changes: req.body.changes,
      previousVersion: before.version,
    };
    Object.assign(existing, req.body.changes, {
      updatedAt: new Date().toISOString(),
      updatedBy: (req as any).user?.id,
      version: existing.version + 1,
      lastAmendment: amendment,
    });
    (req as any).audit('update', existing.id, before, existing, \`AMEND: \${req.body.reason}\`);
    res.json({ entity: existing, amendment });
  });

  // ARCHIVE (soft, reversible, default)
  r.post('/:id/archive', (req, res) => {
    const existing = getById(req.params.id);
    if (!existing) return res.status(404).json({ error: 'Not found' });
    const before = structuredClone(existing);
    existing.status = 'archived';
    existing.archivedAt = new Date().toISOString();
    existing.archivedBy = (req as any).user?.id;
    existing.archiveReason = req.body.reason || 'Admin archived';
    existing.updatedAt = new Date().toISOString();
    (req as any).audit('archive', existing.id, before, existing, existing.archiveReason);
    res.json(existing);
  });

  // RESTORE / REACTIVATE
  r.post('/:id/restore', (req, res) => {
    const existing = getById(req.params.id);
    if (!existing) return res.status(404).json({ error: 'Not found' });
    if (existing.status !== 'archived' && !existing.deletedAt) {
      return res.status(400).json({ error: 'Not archived or soft-deleted' });
    }
    const before = structuredClone(existing);
    existing.status = 'active';
    existing.deletedAt = null;
    existing.deletedBy = null;
    existing.restoredAt = new Date().toISOString();
    existing.restoredBy = (req as any).user?.id;
    existing.restoreReason = req.body.reason || 'Admin reactivated';
    existing.updatedAt = new Date().toISOString();
    (req as any).audit('restore', existing.id, before, existing, existing.restoreReason);
    res.json(existing);
  });

  // SOFT DELETE
  r.delete('/:id', (req, res) => {
    const existing = getById(req.params.id);
    if (!existing) return res.status(404).json({ error: 'Not found' });
    const before = structuredClone(existing);
    existing.deletedAt = new Date().toISOString();
    existing.deletedBy = (req as any).user?.id;
    existing.deleteReason = req.body.reason || req.query.reason;
    existing.status = 'deactivated';
    (req as any).audit('soft_delete', existing.id, before, existing, existing.deleteReason);
    res.json({ message: 'Soft deleted', id: existing.id });
  });

  // PERMANENT DELETE - with confirmation and legal guard
  r.delete('/:id/permanent', (req, res) => {
    if (!config.allowPermanentDelete) {
      return res.status(403).json({ 
        error: \`Permanent delete prohibited for \${config.name}. Legal retention required. Use archive.\`,
        legalReference: 'RRFSO Article 9, GDPR Art 17(3)(b)'
      });
    }
    const { confirmPhrase, reason } = req.body;
    if (confirmPhrase !== \`DELETE \${req.params.id}\`) {
      return res.status(400).json({ error: 'Confirmation phrase must be: DELETE <id>' });
    }
    if (!reason || reason.length < 20) {
      return res.status(400).json({ error: 'Permanent deletion requires detailed justification (min 20 chars)' });
    }
    const existing = getById(req.params.id);
    if (!existing) return res.status(404).json({ error: 'Not found' });
    const before = structuredClone(existing);
    store = store.filter(e => e.id !== req.params.id);
    (req as any).audit('permanent_delete', req.params.id, before, null, reason);
    res.json({ message: 'Permanently deleted', auditId: randomUUID() });
  });

  // DOCUMENTS sub-routes
  r.post('/:id/documents', (req, res) => {
    // Multer / Bun file handling here
    // Upload, replace, rename, move, delete documents
    res.json({ message: 'Document handler - see documents.ts route' });
  });

  return r;
}
