<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Client Portal | Aurelius Fire</title><style>:root{--ink:#10233f;--blue:#145da0;--red:#d52b2b;--muted:#607089;--line:#dbe3ec;--soft:#f5f8fb}*{box-sizing:border-box}body{margin:0;background:var(--soft);color:var(--ink);font:15px/1.5 system-ui,sans-serif}.shell{max-width:1120px;margin:auto;padding:28px 22px}.bar{display:flex;justify-content:space-between;align-items:center;gap:15px}.brand{font-weight:900;letter-spacing:.1em}.brand span,.eyebrow{color:var(--red)}.eyebrow{text-transform:uppercase;letter-spacing:.12em;font-size:12px;font-weight:800}.btn{border:0;border-radius:7px;padding:10px 15px;background:var(--blue);color:#fff;font:inherit;font-weight:750;cursor:pointer}.btn.secondary{background:#fff;color:var(--blue);border:1px solid var(--blue)}.card{background:#fff;border:1px solid var(--line);border-radius:8px;padding:20px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:15px}.stat strong{font-size:28px;display:block}.muted{color:var(--muted)}.pill{display:inline-block;border-radius:20px;padding:3px 8px;background:#eaf4ff;color:var(--blue);font-size:12px;font-weight:750}.progress{display:grid;grid-template-columns:repeat(9,1fr);gap:4px;margin:24px 0}.step{font-size:11px;text-align:center;padding:8px 2px;background:#e8edf2;color:var(--muted)}.step.done{background:#145da0;color:#fff}.form{display:grid;gap:12px;max-width:450px}input{padding:11px;border:1px solid #c8d3df;border-radius:6px;font:inherit}.notice{padding:12px;background:#eaf4ff;border:1px solid #b9d9f5}.error{background:#fff0f0;color:#9f2020;border-color:#f2b7b7}.hidden{display:none!important}.empty{padding:18px;text-align:center;color:var(--muted);border:1px dashed #bcc9d7;border-radius:7px}@media(max-width:750px){.grid,.stats{grid-template-columns:1fr 1fr}.progress{overflow:auto;grid-template-columns:repeat(9,80px)}.bar{align-items:flex-start;flex-direction:column}}@media(max-width:480px){.grid,.stats{grid-template-columns:1fr}}
</style></head><body><main class="shell"><div class="bar"><div><div class="brand">AURELIUS <span>FIRE</span></div><div class="eyebrow">Secure client portal</div><h1 id="heading">Client portal</h1></div><button class="btn secondary hidden" id="logout">Sign out</button></div><section id="login"><div class="card"><h2>Sign in</h2><form id="login-form" class="form"><input name="email" type="email" required placeholder="Email"><input name="password" type="password" required placeholder="Password"><button class="btn">Sign in</button><div id="login-result"></div></form></div></section><section id="dashboard" class="hidden"></section></main><script>const $=s=>document.querySelector(s),api=async(path,options={})=>{const r=await fetch('/api'+path,{credentials:'include',headers:{'Content-Type':'application/json',...(options.headers||{})},...options});const b=await r.json().catch(()=>({}));if(!r.ok)throw Error(b.error||'Request failed');return b};const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function empty(x){return `<div class="empty">${x}</div>`}function progress(d){const q=d.quotes.find(x=>['accepted','viewed','sent'].includes(x.status));const terms=d.terms.length>0;const booking=d.bookings.length>0;const report=d.documents.some(x=>['fra_report','report'].includes(x.category));const action=d.actions.length>0;const done=[d.quotes.length>0,!!q,q?.status==='accepted',terms,d.payments.some(x=>x.status==='paid'),booking,booking&&d.bookings[0].status==='completed',report,action];return '<div class="progress">'+['Enquiry','Quote','Accepted','Terms','Payment','Booking','Assessment','Report','Actions'].map((x,i)=>`<div class="step ${done[i]?'done':''}">${i+1}. ${x}</div>`).join('')+'</div>'}async function load(){try{const d=await api('/portal/dashboard');$('#login').classList.add('hidden');$('#dashboard').classList.remove('hidden');$('#logout').classList.remove('hidden');$('#heading').textContent='Welcome, '+(d.client?.responsiblePerson?.name||d.client?.responsiblePerson||'client');$('#dashboard').innerHTML=progress(d)+`<div class="stats"><div class="card stat"><span class="muted">Quotes</span><strong>${d.quotes.length}</strong></div><div class="card stat"><span class="muted">Bookings</span><strong>${d.bookings.length}</strong></div><div class="card stat"><span class="muted">Documents</span><strong>${d.documents.length}</strong></div><div class="card stat"><span class="muted">Unread messages</span><strong>${d.messages.filter(x=>!x.readAt).length}</strong></div></div><section class="grid" style="margin-top:18px"><article class="card"><h2>Quote</h2>${d.quotes.length?d.quotes.map(q=>`<p><strong>${esc(q.quoteNumber)}</strong><br>£${Number(q.total||0).toLocaleString()}<br><span class="pill">${esc(q.status)}</span></p>`).join(''):empty('No quotes yet.')}</article><article class="card"><h2>Terms</h2>${d.terms.length?d.terms.map(t=>`<p><span class="pill">${esc(t.acceptanceStatus||'Signed')}</span><br>${esc(t.termsVersion)}</p>`).join(''):empty('Terms are not signed yet.')}</article><article class="card"><h2>Payment</h2>${d.payments.length?d.payments.map(p=>`<p><span class="pill">${esc(p.status)}</span></p>`).join(''):empty('No payment recorded.')}</article><article class="card"><h2>Booking</h2>${d.bookings.length?d.bookings.map(b=>`<p>${esc(new Date(b.startsAt).toLocaleString())}<br><span class="pill">${esc(b.status)}</span></p>`).join(''):empty('No upcoming bookings.')}</article><article class="card"><h2>Documents and FRA</h2>${d.documents.length?d.documents.map(x=>`<p>${esc(x.fileName)}<br><span class="pill">${esc(x.category||'document')}</span></p>`).join(''):empty('No documents available.')}</article><article class="card"><h2>Actions</h2>${d.actions.length?d.actions.map(x=>`<p>${esc(x.description||x.title)}<br><span class="pill">${esc(x.status)}</span></p>`).join(''):empty('No actions.')}</article><article class="card"><h2>Messages</h2>${d.messages.length?d.messages.map(x=>`<p>${esc(x.subject||'Message')}<br><span class="muted">${esc(x.createdAt)}</span></p>`).join(''):empty('No messages.')}</article><article class="card"><h2>Account</h2><p>${esc(d.client?.legalName||'Company details unavailable')}</p><p class="muted">${esc(d.client?.email||'')}</p></article></section>`}catch(error){$('#login-result').className='notice error';$('#login-result').textContent=error.message}}$('#login-form').onsubmit=async e=>{e.preventDefault();try{await api('/auth/login',{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});load()}catch(error){$('#login-result').className='notice error';$('#login-result').textContent=error.message}};$('#logout').onclick=async()=>{await api('/auth/logout',{method:'POST'});location.reload()};load()</script></body></html>
