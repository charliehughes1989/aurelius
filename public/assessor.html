<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Aurelius Fire | Assessor Login</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Inter,Arial,sans-serif}
body{background:#f5f7fa;color:#172033;display:flex;align-items:center;justify-content:center;padding:25px}
.card{width:100%;max-width:430px;background:#fff;border:1px solid #e2e7ee;border-radius:16px;padding:32px;box-shadow:0 15px 50px rgba(20,30,45,.10)}
.logo{text-align:center;font-size:21px;font-weight:900;letter-spacing:.3px}
.logo span{color:#c91f2b}
.subtitle{text-align:center;color:#667085;font-size:13px;margin:7px 0 28px}
label{display:block;font-size:12px;font-weight:800;margin:15px 0 6px}
input{display:block;width:100%;padding:12px 13px;border:1px solid #d8dee7;border-radius:8px;font-size:14px;outline:none}
input:focus{border-color:#315ea8;box-shadow:0 0 0 3px rgba(49,94,168,.10)}
button{width:100%;border:0;border-radius:8px;padding:13px;margin-top:18px;background:#172033;color:white;font-size:13px;font-weight:800;cursor:pointer}
button:hover{opacity:.94}
.message{display:none;margin-top:15px;padding:11px;border-radius:8px;font-size:12px;line-height:1.4}
.back{display:block;text-align:center;margin-top:18px;color:#667085;text-decoration:none;font-size:12px}
.setup{display:none}
</style>
</head>

<body>

<div class="card">

<div class="logo">AURELIUS <span>FIRE</span></div>
<div class="subtitle">Assessor & Administration Portal</div>

<section id="loginSection">

<label for="email">Email</label>
<input id="email" type="email" autocomplete="username">

<label for="password">Password</label>
<input id="password" type="password" autocomplete="current-password">

<button id="loginButton" onclick="login()">Sign In</button>

<div id="loginMessage" class="message"></div>

<a class="back" href="/">← Back to Aurelius Fire website</a>

</section>

<section id="setupSection" class="setup">

<h3 style="margin:0 0 7px">Create Administrator</h3>

<p style="font-size:12px;color:#667085;line-height:1.5">
Create the first administrator account for the Aurelius portal.
</p>

<label>Name</label>
<input id="setupName" type="text">

<label>Email</label>
<input id="setupEmail" type="email">

<label>Password</label>
<input id="setupPassword" type="password">

<button onclick="setup()">Create Administrator</button>

<div id="setupMessage" class="message"></div>

<button onclick="showLogin()" style="background:#eef1f5;color:#172033">
Back to Login
</button>

</section>

</div>

<script>
async function jsonFetch(url,options={}){
 const response=await fetch(url,{
   credentials:'same-origin',
   headers:{'Content-Type':'application/json'},
   ...options
 });

 let data={};

 try{
   data=await response.json();
 }catch(e){}

 return {response,data};
}

function showMessage(id,text,good=false){
 const el=document.getElementById(id);
 el.style.display='block';
 el.textContent=text;
 el.style.background=good?'#edf8f0':'#fff0f0';
 el.style.color=good?'#23643a':'#a61b2b';
}

async function checkExistingLogin(){
 try{
   const {response,data}=await jsonFetch('/api/auth/me');

   if(response.ok && data.user){
     const role=data.user.role;

     if(['super_admin','admin','assessor'].includes(role)){
       window.location.replace('/admin');
       return;
     }
   }
 }catch(e){}

 try{
   const {response,data}=await jsonFetch('/api/auth/status');

   if(response.ok && (data.setupRequired || data.needsSetup)){
     document.getElementById('loginSection').style.display='none';
     document.getElementById('setupSection').style.display='block';
   }
 }catch(e){}
}

async function login(){

 const email=document.getElementById('email').value.trim();
 const password=document.getElementById('password').value;
 const button=document.getElementById('loginButton');

 if(!email || !password){
   showMessage('loginMessage','Please enter your email and password.');
   return;
 }

 button.disabled=true;
 button.textContent='Signing in...';

 try{

   const {response,data}=await jsonFetch('/api/auth/login',{
     method:'POST',
     body:JSON.stringify({email,password})
   });

   if(!response.ok){
     showMessage(
       'loginMessage',
       data.error || data.message || 'Incorrect email or password.'
     );
     button.disabled=false;
     button.textContent='Sign In';
     return;
   }

   if(!data.user || !['super_admin','admin','assessor'].includes(data.user.role)){
     showMessage(
       'loginMessage',
       'This account does not have assessor or administrator access.'
     );
     button.disabled=false;
     button.textContent='Sign In';
     return;
   }

   window.location.replace('/admin');

 }catch(error){

   showMessage(
     'loginMessage',
     'The server could not be reached. Make sure the Aurelius server is running.'
   );

   button.disabled=false;
   button.textContent='Sign In';
 }
}

async function setup(){

 const name=document.getElementById('setupName').value.trim();
 const email=document.getElementById('setupEmail').value.trim();
 const password=document.getElementById('setupPassword').value;

 if(!name || !email || !password){
   showMessage('setupMessage','Please complete all fields.');
   return;
 }

 try{

   const {response,data}=await jsonFetch('/api/auth/setup',{
     method:'POST',
     body:JSON.stringify({
       name,
       displayName:name,
       email,
       password
     })
   });

   if(!response.ok){
     showMessage(
       'setupMessage',
       data.error || data.message || 'Administrator setup failed.'
     );
     return;
   }

   showMessage(
     'setupMessage',
     'Administrator created. You can now sign in.',
     true
   );

   setTimeout(()=>{
     document.getElementById('setupSection').style.display='none';
     document.getElementById('loginSection').style.display='block';
     document.getElementById('email').value=email;
   },700);

 }catch(error){
   showMessage(
     'setupMessage',
     'The server could not be reached.'
   );
 }
}

function showLogin(){
 document.getElementById('setupSection').style.display='none';
 document.getElementById('loginSection').style.display='block';
}

document.getElementById('password').addEventListener('keydown',event=>{
 if(event.key==='Enter') login();
});

checkExistingLogin();
</script>

</body>
</html>
