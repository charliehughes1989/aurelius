<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>About Aurelius Fire</title><style>body{margin:0;background:#f5f8fb;color:#10233f;font:16px/1.6 system-ui,sans-serif}.wrap{max-width:900px;margin:35px auto;padding:0 22px}.card{background:#fff;border:1px solid #dbe3ec;border-radius:8px;padding:28px}.brand{font-weight:900;letter-spacing:.1em}.brand span{color:#d52b2b}.profile{display:flex;gap:28px;align-items:flex-start}.photo{width:190px;height:190px;object-fit:cover;border-radius:8px;background:#eef3f7;border:1px solid #dbe3ec}.muted{color:#607089}a{color:#145da0}@media(max-width:650px){.profile{flex-direction:column}.photo{width:140px;height:140px}}</style></head><body><main class="wrap"><div class="brand">AURELIUS <span>FIRE</span></div><div class="card"><h1>About Aurelius Fire</h1><div class="profile"><div id="photo"></div><div id="copy"><p class="muted">Loading...</p></div></div><p><a href="/">Return to Aurelius Fire</a></p></div></main><script>fetch('/api/public/content').then(r=>r.json()).then(({content})=>{const photo=content.profilePhoto?`<img class="photo" src="${String(content.profilePhoto).replace(/"/g,'')}" alt="Aurelius Fire profile photograph">`:'<div class="photo" aria-label="Profile photograph not yet available"></div>';document.querySelector('#photo').innerHTML=photo;document.querySelector('#copy').innerHTML=`<h2>${content.aboutName||'Aurelius Fire'}</h2><p>${content.aboutBiography||content.about||'Professional fire risk assessment and compliance support.'}</p>${content.aboutQualifications?`<h3>Qualifications</h3><p>${content.aboutQualifications}</p>`:''}${content.aboutExperience?`<h3>Experience</h3><p>${content.aboutExperience}</p>`:''}${content.aboutServices?`<h3>Services</h3><p>${content.aboutServices}</p>`:''}${content.aboutContact?`<h3>Contact</h3><p>${content.aboutContact}</p>`:''}`}).catch(()=>document.querySelector('#copy').innerHTML='<p>About information is currently unavailable.</p>')</script></body></html>
