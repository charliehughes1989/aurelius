<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Aurelius Fire Quote</title><style>body{margin:0;background:#f5f8fb;color:#10233f;font:16px/1.55 system-ui,sans-serif}.wrap{max-width:760px;margin:50px auto;padding:0 20px}.card{background:#fff;border:1px solid #dbe3ec;border-radius:8px;padding:28px;box-shadow:0 5px 18px #10233f0a}.eyebrow{color:#d52b2b;font-size:12px;letter-spacing:.12em;font-weight:800}.price{font-size:42px;color:#145da0;font-weight:900}.btn{padding:12px 18px;border:0;border-radius:7px;background:#145da0;color:white;font-weight:800;cursor:pointer;margin:5px}.btn.red{background:#d52b2b}.muted{color:#607089}.notice{padding:12px;background:#eaf4ff;border:1px solid #b9d9f5;margin:15px 0}.error{background:#fff0f0;border-color:#f2b7b7;color:#9f2020}</style></head><body><main class="wrap"><div class="card"><div class="eyebrow">AURELIUS FIRE</div><h1>Your fire risk assessment quote</h1><div id="quote"><p class="muted">Loading quote...</p></div></div></main><script>const q=new URLSearchParams(location.search).get('token'),out=document.querySelector('#quote');const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function load(){if(!q){out.innerHTML='<div class="notice error">This quote link is incomplete.</div>';return}const r=await fetch('/api/public/quotes/'+encodeURIComponent(q));const b=await r.json();if(!r.ok){out.innerHTML='<div class="notice error">'+esc(b.error)+'</div>';return}const x=b.quote;out.innerHTML='<p><strong>Quote '+esc(x.quoteNumber)+'</strong></p><p>'+esc(x.companyName)+'<br>'+esc(x.premises?.address)+'<br>'+esc(x.premises?.postcode)+'</p><div class="price">£'+Number(x.total).toLocaleString()+'</div><p class="muted">Status: '+esc(x.status)+'<br>Expires: '+esc(x.expiresAt?.slice(0,10))+'</p><p>Assessment package: '+esc(x.packageName)+'</p><button class="btn red" onclick="decide(\'accept\')">Accept quote</button><button class="btn" onclick="decide(\'decline\')">Decline quote</button><div id="result"></div>'}async function decide(action){const r=await fetch('/api/public/quotes/'+encodeURIComponent(q)+'/'+action,{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'});const b=await r.json();document.querySelector('#result').className=r.ok?'notice':'notice error';document.querySelector('#result').textContent=r.ok?'Quote '+action+'ed and recorded. The next step is engagement terms and booking.':b.error}load()</script></body></html>
