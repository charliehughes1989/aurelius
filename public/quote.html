<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Quote | Aurelius Fire - North West Fire Risk Assessments</title><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="description" content="Get instant fire risk assessment quote - North West only"><link rel="canonical" href="/quote.html"><style>body{font-family:system-ui,sans-serif;max-width:900px;margin:0 auto;padding:24px;color:#1a1a1a}.card{border:1px solid #e5e7eb;border-radius:12px;padding:20px;margin:16px 0;background:#fff}.btn{background:#0f172a;color:#fff;padding:12px 20px;border-radius:6px;border:none;font-weight:700;cursor:pointer;text-decoration:none;display:inline-block}.btn.secondary{background:#fff;color:#0f172a;border:1px solid #0f172a}input,select,textarea{width:100%;padding:10px;border:1px solid #444;border-radius:6px;margin:6px 0 12px}</style></head><body><h1>Aurelius Fire - Get Your Quote</h1><p>North West site visits only: Merseyside, Greater Manchester, Cheshire, Lancashire, Wirral.</p><a href="/">← Back</a><div id="v" style="display:none"><div class="card" id="qc">Loading...</div><button class="btn" id="a">Accept Quote</button> <button class="btn secondary" id="d">Decline</button></div><div id="n"><div class="card"><h2>Instant Price</h2><form id="qf"><input name="customerName" placeholder="Your name" required><input name="companyName" placeholder="Company" required><input name="email" type="email" placeholder="Email" required><input name="telephone" placeholder="Phone" required><input name="premisesAddress" placeholder="Premises address" required><input name="postcode" placeholder="Postcode" required><select name="premisesType" required><option value="">Premises type</option><option>Office</option><option>Shop</option><option>Restaurant</option><option>HMO</option><option>Warehouse</option><option>Industrial</option><option>Other</option></select><input name="floors" type="number" placeholder="Floors" required><input name="approximateSize" type="number" placeholder="Size m2" required><textarea name="occupancyInformation" placeholder="Occupancy info" required></textarea><label><input type="checkbox" name="sleepingAccommodation" value="true"> Sleeping?</label><textarea name="additionalInformation" placeholder="Additional info"></textarea><button class="btn" type="submit">Get Price</button></form><div id="r"></div></div></div><script>const p=new URLSearchParams(location.search),t=p.get("token"),v=document.getElementById("v"),n=document.getElementById("n");if(t){v.style.display="block";n.style.display="none";fetch("/api/public/quotes/"+t).then(r=>r.json()).then(d=>{if(d.error||!d.quote){document.getElementById("qc").innerHTML='<p>This quote link is incomplete or expired. Request a new quote below.</p><a class="btn" href="/quote.html">New Quote</a>';return;}document.getElementById("qc").innerHTML='<h3>'+d.quote.quoteNumber+' - £'+d.quote.total+'</h3><p>Status: '+d.quote.status+'</p>'});}document.getElementById("a").onclick=()=>fetch("/api/public/quotes/"+t+"/accept",{method:"POST"}).then(()=>location.href="/portal");document.getElementById("d").onclick=()=>fetch("/api/public/quotes/"+t+"/decline",{method:"POST"}).then(()=>location.reload());document.getElementById("qf")?.addEventListener("submit",async e=>{e.preventDefault();const fd=new FormData(e.target),b=Object.fromEntries(fd.entries());b.floors=Number(b.floors);b.approximateSize=Number(b.approximateSize);b.sleepingAccommodation=fd.get("sleepingAccommodation")==="true";const res=await fetch("/api/public/quotes",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(b)});const d=await res.json();document.getElementById("r").innerHTML=res.ok?'<div class="card"><h3>'+d.quoteNumber+' - £'+d.estimatedPrice+'</h3><a class="btn" href="/quote.html?token='+d.quoteToken+'">View & Accept Quote</a></div>':'<p style="color:red">'+(d.error||"Error")+'</p>'});</script></body></html>
