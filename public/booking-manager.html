<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Aurelius Fire | Booking Manager</title>
<style>
body{
 margin:0;
 font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
 background:#f6f8fb;
 color:#172033;
}
header{
 background:#fff;
 border-bottom:1px solid #e4e7ec;
 padding:20px 30px;
 display:flex;
 justify-content:space-between;
 align-items:center;
}
h1{margin:0;font-size:25px}
main{padding:30px;max-width:1300px;margin:auto}
.card{
 background:#fff;
 border:1px solid #e4e7ec;
 border-radius:14px;
 padding:20px;
 margin-bottom:18px;
}
table{width:100%;border-collapse:collapse}
th,td{
 padding:14px;
 border-bottom:1px solid #eaecf0;
 text-align:left;
}
th{
 color:#667085;
 font-size:12px;
 text-transform:uppercase;
}
button{
 border:0;
 border-radius:8px;
 padding:9px 13px;
 font-weight:700;
 cursor:pointer;
 margin-right:6px;
}
.approve{background:#1769aa;color:white}
.decline{background:#fff;border:1px solid #d0d5dd}
.complete{background:#ecfdf3;color:#027a48}
.badge{
 display:inline-block;
 padding:5px 9px;
 border-radius:999px;
 background:#eef6fc;
 color:#1769aa;
 font-size:12px;
 font-weight:700;
}
</style>
</head>
<body>

<header>
  <div>
    <h1>Aurelius Fire — Booking Manager</h1>
    <div style="color:#667085;margin-top:5px">
      Manage client assessment bookings
    </div>
  </div>

  <button onclick="loadBookings()">↻ Refresh</button>
</header>

<main>
  <div class="card">
    <div id="content">Loading bookings...</div>
  </div>
</main>

<script>
async function request(path,options={}){
 const r=await fetch('/api/payment-booking'+path,{
  credentials:'include',
  headers:{'Content-Type':'application/json'},
  ...options
 });

 const data=await r.json();

 if(!r.ok) throw new Error(data.error||'Request failed');

 return data;
}

function esc(v){
 return String(v??'')
 .replaceAll('&','&amp;')
 .replaceAll('<','&lt;')
 .replaceAll('>','&gt;')
 .replaceAll('"','&quot;');
}

function render(data){
 if(!data.length){
  document.getElementById('content').innerHTML=
   '<p style="color:#667085">No bookings found.</p>';
  return;
 }

 document.getElementById('content').innerHTML=`
 <table>
 <thead>
 <tr>
  <th>Date</th>
  <th>Time</th>
  <th>Premises</th>
  <th>Status</th>
  <th>Actions</th>
 </tr>
 </thead>
 <tbody>
 ${data.map(b=>`
 <tr>
  <td><strong>${esc(b.date||'—')}</strong></td>
  <td>${esc(b.time||'—')}</td>
  <td>${esc(b.premises||b.premises_name||'—')}</td>
  <td><span class="badge">${esc(b.status||'requested')}</span></td>
  <td>
   ${
    b.status==='requested'
    ? `
      <button class="approve"
       onclick="approve('${esc(b.id)}')">
       Confirm
      </button>
      <button class="decline"
       onclick="decline('${esc(b.id)}')">
       Decline
      </button>
    `
    : ''
   }

   ${
    b.status==='confirmed'
    ? `
      <button class="complete"
       onclick="completeBooking('${esc(b.id)}')">
       Mark Complete
      </button>
    `
    : ''
   }
  </td>
 </tr>
 `).join('')}
 </tbody>
 </table>
 `;
}

async function loadBookings(){
 try{
  const result=await request('/bookings');
  render(result.data||[]);
 }catch(e){
  document.getElementById('content').innerHTML=
   '<p style="color:#b42318">'+esc(e.message)+'</p>';
 }
}

async function approve(id){
 try{
  await request('/booking/'+id+'/approve',{
   method:'POST',
   body:JSON.stringify({})
  });

  await loadBookings();
 }catch(e){alert(e.message)}
}

async function decline(id){
 const reason=prompt('Reason for declining this booking:')||'';

 try{
  await request('/booking/'+id+'/decline',{
   method:'POST',
   body:JSON.stringify({reason})
  });

  await loadBookings();
 }catch(e){alert(e.message)}
}

async function completeBooking(id){
 const notes=prompt('Completion notes (optional):')||'';

 try{
  await request('/booking/'+id+'/complete',{
   method:'POST',
   body:JSON.stringify({notes})
  });

  await loadBookings();
 }catch(e){alert(e.message)}
}

loadBookings();
</script>
</body>
</html>
