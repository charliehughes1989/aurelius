<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Book an Assessment | Aurelius Fire</title><style>body{margin:0;background:#f5f8fb;color:#10233f;font:16px/1.55 system-ui,sans-serif}.wrap{max-width:820px;margin:35px auto;padding:0 22px}.card{background:#fff;border:1px solid #dbe3ec;border-radius:8px;padding:28px}.brand{font-weight:900;letter-spacing:.1em}.brand span{color:#d52b2b}.slots{display:grid;gap:10px;margin:20px 0}.slot{border:1px solid #145da0;background:#fff;color:#145da0;border-radius:7px;padding:13px;text-align:left;cursor:pointer}.slot.selected{background:#145da0;color:#fff}.form{display:grid;gap:12px;max-width:560px}input{font:inherit;padding:12px;border:1px solid #c8d3df;border-radius:6px}.btn{padding:12px 18px;border:0;border-radius:7px;background:#145da0;color:white;font-weight:800;cursor:pointer}.notice{padding:12px;background:#eaf4ff;border:1px solid #b9d9f5;margin:15px 0}.error{background:#fff0f0;border-color:#f2b7b7;color:#9f2020}a{color:#145da0}</style></head><body><main class="wrap"><div class="brand">AURELIUS <span>FIRE</span></div><div class="card"><h1>Book an assessment</h1><p>Choose a genuine available slot. You will need a client portal account to confirm the booking.</p><div id="slots">Loading availability...</div><form id="form" class="form hidden"><input name="slotId" id="slotId" type="hidden"><input name="contactName" required placeholder="Contact name"><input name="email" type="email" required placeholder="Email"><input name="premises" required placeholder="Premises address"><button class="btn">Confirm booking</button><div id="result"></div></form><p><a href="/">Return to Aurelius Fire</a></p></div></main><script>const slots=document.querySelector('#slots'),form=document.querySelector('#form'),result=document.querySelector('#result');const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let selected=null;fetch('/api/public/booking-availability').then(r=>r.json()).then(x=>{if(!x.slots.length){slots.innerHTML='<div class="notice">No upcoming slots are available. Please contact Aurelius Fire.</div>';return}slots.className='slots';slots.innerHTML=x.slots.map(s=>`<button type="button" class="slot" data-id="${esc(s.id)}">${esc(new Date(s.startsAt).toLocaleString())} to ${esc(new Date(s.endsAt).toLocaleTimeString())}</button>`).join('');document.querySelectorAll('.slot').forEach(b=>b.onclick=()=>{document.querySelectorAll('.slot').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');selected=b.dataset.id;document.querySelector('#slotId').value=selected;form.classList.remove('hidden')})}).catch(e=>slots.innerHTML='<div class="notice error">Unable to load availability.</div>');form.onsubmit=async e=>{e.preventDefault();result.textContent='';try{const r=await fetch('/api/portal/bookings',{method:'POST',credentials:'include',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(form)))});const b=await r.json();if(r.status===401){result.className='notice error';result.textContent='Please sign in through the client portal before confirming a booking.';return}if(!r.ok)throw Error(b.error);result.className='notice';result.textContent=`Booking ${b.id} saved with status ${b.status}.`;form.reset()}catch(e){result.className='notice error';result.textContent=e.message}}</script></body></html>
