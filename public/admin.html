<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Aurelius Fire CRM</title><style>:root{--ink:#10233f;--blue:#145da0;--red:#d52b2b;--muted:#607089;--line:#dbe3ec;--soft:#f5f8fb}*{box-sizing:border-box}body{margin:0;background:var(--soft);color:var(--ink);font:15px/1.5 system-ui,sans-serif}.shell{max-width:1240px;margin:auto;padding:28px 24px}.bar{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:24px}.brand{font-weight:900;letter-spacing:.1em}.brand span,.eyebrow{color:var(--red)}.eyebrow{text-transform:uppercase;letter-spacing:.12em;font-size:12px;font-weight:800}.tabs{display:flex;gap:8px;overflow:auto;margin-bottom:22px}.btn{border:0;border-radius:7px;padding:10px 15px;background:var(--blue);color:#fff;font:inherit;font-weight:750;cursor:pointer;white-space:nowrap}.btn.secondary{background:#fff;color:var(--blue);border:1px solid var(--blue)}.btn.red{background:var(--red)}.btn.small{padding:7px 10px;font-size:13px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.card{background:#fff;border:1px solid var(--line);border-radius:8px;padding:20px;box-shadow:0 5px 18px #10233f0a}.card h2,.card h3{margin-top:0}.form{display:grid;gap:11px}label{display:grid;gap:5px;font-weight:700}input,textarea,select{width:100%;font:inherit;padding:10px;border:1px solid #c8d3df;border-radius:6px;background:#fff;color:var(--ink)}textarea{min-height:88px;resize:vertical}.notice{padding:11px 13px;border-radius:6px;background:#eaf4ff;border:1px solid #b9d9f5;margin:10px 0}.error{background:#fff0f0;border-color:#f2b7b7;color:#9f2020}.muted{color:var(--muted)}.stat strong{font-size:30px;display:block}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;background:#fff}.table th,.table td{text-align:left;padding:10px;border-bottom:1px solid var(--line);vertical-align:top}.pill{display:inline-block;padding:3px 8px;border-radius:20px;background:#eaf4ff;color:var(--blue);font-size:12px;font-weight:750}.pill.red{background:#fff0f0;color:#a21e1e}.empty{padding:24px;text-align:center;color:var(--muted);border:1px dashed #bcc9d7;border-radius:8px}.photo{width:160px;height:160px;object-fit:cover;border-radius:8px;border:1px solid var(--line);background:#eef3f7}.actions{display:flex;gap:7px;flex-wrap:wrap}.modal{position:fixed;inset:0;background:#10233f66;display:grid;place-items:center;padding:18px;z-index:3}.modal>div{background:#fff;border-radius:8px;padding:24px;width:min(760px,100%);max-height:92vh;overflow:auto}.hidden{display:none!important}@media(max-width:760px){.grid,.two{grid-template-columns:1fr}.bar{align-items:flex-start;flex-direction:column}.shell{padding:20px 14px}.table{min-width:720px}}
</style></head><body><main class="shell"><div class="bar"><div><div class="brand">AURELIUS <span>FIRE</span></div><div class="eyebrow">Operations CRM</div><h1>Business control</h1></div><button class="btn secondary" id="logout">Sign out</button></div><nav class="tabs"><button class="btn" data-view="dashboard">Dashboard</button><button class="btn secondary" data-view="clients">Clients</button><button class="btn secondary" data-view="quotes">Quotes</button><button class="btn secondary" data-view="calendar">Calendar</button><button class="btn secondary" data-view="pricing">Pricing</button><button class="btn secondary" data-view="content">Website content</button><button class="btn secondary" data-view="services">Services</button><button class="btn secondary" data-view="faqs">FAQs</button><button class="btn secondary" data-view="audit">Audit log</button></nav><section id="view"></section></main><div id="quote-modal" class="modal hidden"><div><div class="bar"><h2>Quote details</h2><button class="btn secondary" onclick="closeQuote()">Close</button></div><div id="quote-detail"></div></div></div><script>const $=s=>document.querySelector(s),api=async(path,options={})=>{const r=await fetch('/api'+path,{credentials:'include',headers:{'Content-Type':'application/json',...(options.headers||{})},...options});const b=await r.json().catch(()=>({}));if(!r.ok)throw Error(b.error||'Request failed');return b};const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const msg=(x,bad=false)=>`<div class="notice${bad?' error':''}">${esc(x)}</div>`;const empty=x=>`<div class="empty">${x}</div>`;const json=(x)=>JSON.stringify(x);
async function dashboard(){const d=await api('/admin/dashboard');const cards=[['Open enquiries',d.openEnquiries,'enquiries'],['Outstanding quotes',d.outstandingQuotes,'quotes'],['Accepted quotes',d.acceptedQuotes,'quotes'],['Upcoming bookings',d.upcomingBookings,'calendar'],['Outstanding actions',d.outstandingActions,'actions'],['Unread messages',d.unreadMessages,'messages'],['Reports awaiting upload',d.documentsAwaitingUpload,'documents']];$('#view').innerHTML='<div class="grid">'+cards.map(([label,value,view])=>`<button class="card stat" data-jump="${view}" style="text-align:left;border:1px solid var(--line);cursor:pointer"><span class="eyebrow">${label}</span><strong>${value}</strong><span class="muted">Open section</span></button>`).join('')+'</div>';document.querySelectorAll('[data-jump]').forEach(x=>x.onclick=()=>show(x.dataset.jump))}
async function content(){const r=await api('/admin/content');const v=Object.fromEntries(Object.entries(r).map(([k,x])=>[k,x.value]));$('#view').innerHTML=`<form id="content-form" class="form"><div class="card"><h2>Homepage and contact</h2><div class="two"><label>Hero heading<input name="heroHeading" value="${esc(v.heroHeading)}"></label><label>Primary button<input name="primaryButton" value="${esc(v.primaryButton||'Get a quote')}"></label></div><label>Hero text<textarea name="heroText">${esc(v.heroText)}</textarea></label><div class="two"><label>Telephone<input name="telephone" value="${esc(v.telephone)}"></label><label>Email<input name="email" value="${esc(v.email)}"></label></div><label>Address/service area<textarea name="address">${esc(v.address)}</textarea></label></div><div class="card"><h2>About Me</h2><div class="two"><label>Name<input name="aboutName" value="${esc(v.aboutName)}"></label><label>Photo URL<input name="profilePhoto" value="${esc(v.profilePhoto)}" readonly></label></div><label>Biography<textarea name="aboutBiography">${esc(v.aboutBiography||v.about)}</textarea></label><label>Qualifications<textarea name="aboutQualifications">${esc(v.aboutQualifications)}</textarea></label><label>Experience<textarea name="aboutExperience">${esc(v.aboutExperience)}</textarea></label><label>Services description<textarea name="aboutServices">${esc(v.aboutServices)}</textarea></label><div class="actions"><button type="button" class="btn secondary" onclick="uploadPhoto()">Choose/upload photograph</button><button type="button" class="btn secondary" onclick="deletePhoto()">Delete photograph</button></div><div id="photo-result"></div><img id="photo-preview" class="photo ${v.profilePhoto?'':'hidden'}" src="${esc(v.profilePhoto)}" alt="Current profile photograph"></div><div class="card"><h2>Policies</h2><label>Terms<textarea name="terms">${esc(v.terms)}</textarea></label><label>Privacy<textarea name="privacy">${esc(v.privacy)}</textarea></label><label>Cookie information<textarea name="cookies">${esc(v.cookies)}</textarea></label></div><button class="btn red">Save changes</button><div id="content-result"></div></form>`;$('#content-form').onsubmit=async e=>{e.preventDefault();try{await api('/admin/content',{method:'PUT',body:json(Object.fromEntries(new FormData(e.target)))});$('#content-result').innerHTML=msg('Website content saved.')}catch(err){$('#content-result').innerHTML=msg(err.message,true)}}}
window.uploadPhoto=()=>{const input=document.createElement('input');input.type='file';input.accept='image/jpeg,image/png,image/webp';input.onchange=()=>{const file=input.files[0];if(!file)return;if(file.size>5*1024*1024)return $('#photo-result').innerHTML=msg('Photo must be 5MB or smaller.',true);const reader=new FileReader();reader.onload=async()=>{try{const r=await api('/admin/content/profile-photo',{method:'POST',body:json({mimeType:file.type,content:String(reader.result).split(',')[1]})});$('#photo-preview').src=r.url;$('#photo-preview').classList.remove('hidden');$('#photo-result').innerHTML=msg('Photograph uploaded successfully.')}catch(err){$('#photo-result').innerHTML=msg(err.message,true)}};reader.readAsDataURL(file)};input.click()};window.deletePhoto=async()=>{try{await api('/admin/content/profile-photo',{method:'DELETE'});$('#photo-preview').classList.add('hidden');$('#photo-result').innerHTML=msg('Photograph deleted.')}catch(err){$('#photo-result').innerHTML=msg(err.message,true)}};
async function pricing(){const items=await api('/admin/pricing');$('#view').innerHTML='<div class="bar"><h2>Pricing packages</h2><button class="btn red" onclick="newPricing()">Add package</button></div><div class="grid">'+(items.length?items.map(x=>`<form class="card price-form form" data-id="${esc(x.id)}"><h3>${esc(x.name)}</h3><input name="name" value="${esc(x.name)}" required><input name="price" type="number" min="0" value="${esc(x.price)}" required><textarea name="description" placeholder="Description">${esc(x.description)}</textarea><input name="criteria" value="${esc(x.criteria)}" placeholder="Criteria"><input name="order" type="number" value="${esc(x.order)}"><label>Active <input name="active" type="checkbox" ${x.status==='active'?'checked':''}></label><div class="actions"><button class="btn">Save</button><button type="button" class="btn secondary" onclick="archiveRecord('${esc(x.id)}')">${x.status==='archived'?'Restore':'Archive'}</button><button type="button" class="btn secondary" onclick="deleteRecord('${esc(x.id)}')">Delete</button></div><div class="result"></div></form>`).join(''):empty('No pricing packages yet.')+'</div>';document.querySelectorAll('.price-form').forEach(f=>f.onsubmit=async e=>{e.preventDefault();const data=Object.fromEntries(new FormData(f));data.status=f.querySelector('[name=active]').checked?'active':'inactive';try{await api('/admin/pricing/'+f.dataset.id,{method:'PUT',body:json(data)});f.querySelector('.result').innerHTML=msg('Saved.')}catch(err){f.querySelector('.result').innerHTML=msg(err.message,true)}})}window.newPricing=()=>{$('#view').insertAdjacentHTML('afterbegin','<form id="new-price" class="card form"><h2>New package</h2><div class="two"><input name="name" required placeholder="Package name"><input name="price" required type="number" min="0" placeholder="Price"></div><textarea name="description" placeholder="Description"></textarea><input name="criteria" placeholder="Criteria"><input name="order" type="number" value="5"><button class="btn">Add package</button><div id="new-result"></div></form>');$('#new-price').onsubmit=async e=>{e.preventDefault();try{await api('/admin/pricing',{method:'POST',body:json(Object.fromEntries(new FormData(e.target)))});pricing()}catch(err){$('#new-result').innerHTML=msg(err.message,true)}}};window.archiveRecord=async id=>{const record=(await api('/admin/pricing')).find(x=>x.id===id);await api('/admin/pricing/'+id+'/'+(record.status==='archived'?'restore':'archive'),{method:'POST',body:'{}'});pricing()};window.deleteRecord=async id=>{if(confirm('Permanently delete this package?')){await api('/admin/pricing/'+id+'?confirm=PERMANENTLY_DELETE',{method:'DELETE'});pricing()}};
async function services(type='services'){const items=await api('/admin/'+type);$('#view').innerHTML=`<div class="bar"><h2>${type==='services'?'Services':'FAQs'}</h2><button class="btn red" onclick="newRecord('${type}')">Add</button></div><div class="grid">${items.length?items.map(x=>`<form class="card form record-form" data-id="${esc(x.id)}"><input name="${type==='services'?'name':'question'}" value="${esc(x.name||x.question)}" required><textarea name="${type==='services'?'description':'answer'}">${esc(x.description||x.answer)}</textarea><input name="order" type="number" value="${esc(x.order)}"><div class="actions"><button class="btn">Save</button><button type="button" class="btn secondary" onclick="toggleRecord('${type}','${esc(x.id)}','${x.status}')">${x.status==='archived'?'Restore':'Archive'}</button><button type="button" class="btn secondary" onclick="deleteEntity('${type}','${esc(x.id)}')">Delete</button></div><div class="result"></div></form>`).join(''):empty('No records yet.')}</div>`;document.querySelectorAll('.record-form').forEach(f=>f.onsubmit=async e=>{e.preventDefault();try{await api('/admin/'+type+'/'+f.dataset.id,{method:'PUT',body:json(Object.fromEntries(new FormData(f)))});f.querySelector('.result').innerHTML=msg('Saved.')}catch(err){f.querySelector('.result').innerHTML=msg(err.message,true)}})}window.newRecord=type=>{const fields=type==='services'?'<input name="name" required placeholder="Service name"><textarea name="description" required placeholder="Description">':'<input name="question" required placeholder="Question"><textarea name="answer" required placeholder="Answer">';$('#view').insertAdjacentHTML('afterbegin',`<form id="new-record" class="card form">${fields}<input name="order" type="number" value="1"><button class="btn">Add</button><div id="new-result"></div></form>`);$('#new-record').onsubmit=async e=>{e.preventDefault();try{await api('/admin/'+type,{method:'POST',body:json(Object.fromEntries(new FormData(e.target)))});services(type)}catch(err){$('#new-result').innerHTML=msg(err.message,true)}}};window.toggleRecord=async(type,id,status)=>{await api('/admin/'+type+'/'+id+'/'+(status==='archived'?'restore':'archive'),{method:'POST',body:'{}'});services(type)};window.deleteEntity=async(type,id)=>{if(confirm('Permanently delete this record?')){await api('/admin/'+type+'/'+id+'?confirm=PERMANENTLY_DELETE',{method:'DELETE'});services(type)}};
async function calendar(){const [slots,bookings]=await Promise.all([api('/admin/booking_slots?status=all'),api('/admin/bookings?status=all')]);$('#view').innerHTML=`<div class="bar"><h2>Booking calendar</h2><button class="btn red" onclick="newSlot()">Create availability</button></div><div class="grid"><div class="card"><h3>Availability</h3>${slots.length?slots.map(s=>`<div class="card"><strong>${esc(new Date(s.startsAt).toLocaleString())}</strong><p class="muted">${esc(new Date(s.endsAt).toLocaleTimeString())} · ${s.available?'Available':'Booked/blocked'}</p><button class="btn secondary small" onclick="blockSlot('${esc(s.id)}',${s.available})">${s.available?'Block':'Unblock'}</button></div>`).join(''):empty('No availability yet.')}</div><div class="card"><h3>Appointments</h3>${bookings.length?bookings.map(b=>`<div class="card"><strong>${esc(new Date(b.startsAt).toLocaleString())}</strong><p>${esc(b.customerName||b.clientId||'Client')}<br>${esc(b.premises||'Premises not provided')}<br><span class="pill">${esc(b.status)}</span></p><button class="btn secondary small" onclick="cancelBooking('${esc(b.id)}')">Cancel</button></div>`).join(''):empty('No upcoming bookings.')}</div></div>`}window.newSlot=()=>{const starts=prompt('Start date/time in ISO format');const ends=prompt('End date/time in ISO format');if(starts&&ends)api('/admin/booking_slots',{method:'POST',body:json({startsAt:starts,endsAt:ends})}).then(calendar).catch(e=>alert(e.message))};window.blockSlot=async(id,available)=>{await api('/admin/booking_slots/'+id,{method:'PUT',body:json({available:!available})});calendar()};window.cancelBooking=async id=>{await api('/admin/bookings/'+id+'/cancel',{method:'POST',body:'{}'});calendar()};
async function quotes(){const search=prompt('Search quotes (leave blank for all)')||'';const status=prompt('Status filter: all, draft, sent, viewed, accepted, declined, cancelled','all')||'all';const items=await api('/admin/quotes?search='+encodeURIComponent(search)+'&status='+encodeURIComponent(status));$('#view').innerHTML=`<div class="bar"><h2>Quotes</h2><button class="btn secondary" onclick="quotes()">Search/filter</button></div><div class="table-wrap"><table class="table"><tr><th>Quote</th><th>Customer</th><th>Price</th><th>Status</th><th>Action</th></tr>${items.length?items.map(x=>`<tr><td>${esc(x.quoteNumber)}</td><td>${esc(x.customerName||x.companyName)}</td><td>£${Number(x.total||0).toLocaleString()}</td><td><span class="pill">${esc(x.status)}</span></td><td><button class="btn small" onclick="quoteDetail('${esc(x.id)}')">Open</button></td></tr>`).join(''):'<tr><td colspan="5">No quotes yet.</td></tr>'}</table></div>`}window.quoteDetail=async id=>{const x=(await api('/admin/quotes?status=all')).find(q=>q.id===id);if(!x)return;$('#quote-detail').innerHTML=`<p><strong>${esc(x.quoteNumber)}</strong> · <span class="pill">${esc(x.status)}</span></p><p>Customer: ${esc(x.customerName)}<br>Company: ${esc(x.companyName)}<br>Premises: ${esc(x.premises?.address)} ${esc(x.premises?.postcode)}<br>Price: £${Number(x.total||0).toLocaleString()}<br>Created: ${esc(x.createdAt)}<br>Terms: ${x.status==='accepted'?'Ready for terms':'Pending acceptance'}<br>Payment: unpaid until Stripe confirms payment</p><div class="actions">${['draft','viewed','declined'].includes(x.status)?`<button class="btn" onclick="quoteAction('${x.id}','send')">Send/resend</button>`:''}${!['cancelled','accepted'].includes(x.status)?`<button class="btn red" onclick="quoteAction('${x.id}','cancel')">Cancel</button>`:''}</div>`;$('#quote-modal').classList.remove('hidden')};window.quoteAction=async(id,action)=>{await api('/admin/quotes/'+id+'/'+action,{method:'POST',body:'{}'});closeQuote();quotes()};window.closeQuote=()=>$('#quote-modal').classList.add('hidden');
async function audit(){const rows=await api('/admin/audit-log');$('#view').innerHTML='<h2>Audit log</h2><div class="table-wrap"><table class="table"><tr><th>Time</th><th>Action</th><th>Entity</th><th>Actor</th></tr>'+rows.map(x=>`<tr><td>${esc(x.timestamp)}</td><td>${esc(x.action)}</td><td>${esc(x.entity_type)} ${esc(x.entity_id)}</td><td>${esc(x.actor_id)}</td></tr>`).join('')+'</table></div>'}
const views={dashboard,content,pricing,services,faqs:()=>services('faqs'),calendar,quotes,audit,clients:()=>collection('clients'),actions:()=>collection('actions'),documents:()=>collection('documents'),messages:()=>collection('messages')};async function collection(type){const items=await api('/admin/'+type);$('#view').innerHTML=`<h2>${esc(type)}</h2>${items.length?'<div class="grid">'+items.map(x=>`<article class="card"><h3>${esc(x.name||x.title||x.fileName||x.id)}</h3><p class="muted">${esc(x.status)}</p><p>${esc(x.description||x.message||'')}</p></article>`).join('')+'</div>':empty('No '+type+' yet.')}}async function show(name){try{await views[name]()}catch(e){$('#view').innerHTML=msg(e.message,true)}}document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>show(b.dataset.view));$('#logout').onclick=async()=>{await api('/auth/logout',{method:'POST'});location.href='/'};show('dashboard');</script></body></html>
