<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Aurelius Fire Risk — Assessor CRM</title>
<style>
:root{
  --blue:#0b5ed7;
  --blue2:#083b88;
  --red:#d92323;
  --ink:#152033;
  --muted:#687386;
  --line:#e5e9f0;
  --bg:#f5f7fa;
  --white:#fff;
  --green:#16834b;
  --amber:#b77900;
  --shadow:0 8px 28px rgba(15,35,70,.08);
}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--ink)}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.app{display:flex;min-height:100vh}
.sidebar{
  width:245px;background:#071b3b;color:#fff;position:fixed;left:0;top:0;bottom:0;
  display:flex;flex-direction:column;z-index:20
}
.brand{padding:24px 20px;border-bottom:1px solid rgba(255,255,255,.1)}
.brand strong{font-size:20px;display:block}
.brand span{font-size:11px;letter-spacing:1.5px;opacity:.7}
.nav{padding:12px;overflow:auto;flex:1}
.nav button{
  width:100%;border:0;background:none;color:#dce6f7;text-align:left;padding:11px 13px;
  border-radius:9px;margin:2px 0;font-weight:600
}
.nav button:hover,.nav button.active{background:#103c78;color:#fff}
.nav .section{font-size:10px;color:#7890b5;letter-spacing:1.2px;margin:18px 12px 5px;text-transform:uppercase}
.side-bottom{padding:12px;border-top:1px solid rgba(255,255,255,.1)}
.main{margin-left:245px;min-width:0;flex:1}
.top{
  height:70px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;
  justify-content:space-between;padding:0 28px;position:sticky;top:0;z-index:10
}
.top h1{font-size:21px;margin:0}
.identity{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:13px}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;font-weight:700}
.content{padding:28px;max-width:1600px;margin:auto}
.page{display:none}
.page.active{display:block}
.cards{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:15px}
.card{
  background:#fff;border:1px solid var(--line);border-radius:14px;padding:19px;box-shadow:var(--shadow)
}
.card .label{font-size:12px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.4px}
.card .num{font-size:29px;font-weight:800;margin-top:8px}
.panel{
  background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);margin-top:20px;
  overflow:hidden
}
.panel-head{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:15px}
.panel-head h2{margin:0;font-size:17px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap}
.btn{
  border:1px solid var(--line);background:#fff;color:var(--ink);padding:9px 13px;border-radius:8px;
  font-weight:700
}
.btn:hover{border-color:#b8c4d8}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.red{background:var(--red);border-color:var(--red);color:#fff}
.btn.green{background:var(--green);border-color:var(--green);color:#fff}
.btn.small{padding:6px 9px;font-size:12px}
.table-wrap{overflow:auto}
table{border-collapse:collapse;width:100%;min-width:760px}
th,td{padding:12px 15px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top;font-size:13px}
th{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);background:#fafbfc}
tr:hover td{background:#fbfcff}
.badge{display:inline-flex;border-radius:999px;padding:4px 8px;font-size:11px;font-weight:800;background:#eef2f7;color:#536174}
.badge.green{background:#e7f6ee;color:#137341}
.badge.red{background:#fdeaea;color:#a91e1e}
.badge.amber{background:#fff4d9;color:#8c6500}
.badge.blue{background:#e8f1ff;color:#1253a4}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:15px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}
.form{padding:20px}
.field{margin-bottom:14px}
.field label{display:block;font-size:12px;font-weight:800;margin-bottom:6px;color:#465268}
.field input,.field select,.field textarea{
  width:100%;padding:10px 11px;border:1px solid #d5dce7;border-radius:8px;background:#fff;color:var(--ink)
}
.field textarea{min-height:110px;resize:vertical}
.modal{
  display:none;position:fixed;inset:0;background:rgba(4,14,30,.55);z-index:100;
  align-items:center;justify-content:center;padding:20px
}
.modal.open{display:flex}
.modal-box{background:#fff;width:min(850px,100%);max-height:90vh;overflow:auto;border-radius:15px;box-shadow:0 20px 70px rgba(0,0,0,.25)}
.modal-head{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between}
.modal-head h2{margin:0;font-size:18px}
.modal-body{padding:20px}
.close{border:0;background:none;font-size:25px;color:var(--muted)}
.notice{padding:12px 14px;border-radius:9px;background:#edf5ff;border:1px solid #cfe0fb;color:#174d96;margin-bottom:15px}
.empty{text-align:center;color:var(--muted);padding:45px}
.search{padding:9px 11px;border:1px solid var(--line);border-radius:8px;min-width:220px}
.kpi{display:flex;justify-content:space-between;align-items:center}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:20px}
.quick button{padding:16px;text-align:left;background:#fff;border:1px solid var(--line);border-radius:12px;font-weight:700}
.quick button span{display:block;font-size:12px;color:var(--muted);font-weight:400;margin-top:4px}
.loading{padding:35px;text-align:center;color:var(--muted)}
@media(max-width:1050px){
 .sidebar{width:205px}.main{margin-left:205px}.cards{grid-template-columns:repeat(3,1fr)}
}
@media(max-width:750px){
 .sidebar{position:relative;width:100%;height:auto}.app{display:block}.main{margin-left:0}.nav{display:flex;overflow:auto}.nav .section{display:none}.nav button{white-space:nowrap;width:auto}
 .top{position:relative}.cards,.grid2,.grid3,.quick{grid-template-columns:1fr 1fr}.content{padding:15px}
}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar">
  <div class="brand">
    <strong>AURELIUS</strong>
    <span>FIRE RISK · ASSESSOR CRM</span>
  </div>
  <nav class="nav">
    <div class="section">Overview</div>
    <button data-page="dashboard" class="active">▦ Dashboard</button>

    <div class="section">Sales & Clients</div>
    <button data-page="enquiries">☏ Enquiries</button>
    <button data-page="clients">♙ Clients</button>
    <button data-page="premises">⌂ Premises</button>
    <button data-page="quotes">£ Quotes</button>
    <button data-page="bookings">◷ Bookings</button>

    <div class="section">Assessments</div>
    <button data-page="assessments">✓ Assessments</button>
    <button data-page="previsit">▣ Pre-Visit</button>
    <button data-page="documents">▤ Documents / FRA</button>
    <button data-page="actions">⚑ Actions</button>
    <button data-page="certificates">◇ Certificates</button>

    <div class="section">Client Communication</div>
    <button data-page="messages">✉ Messages</button>
    <button data-page="payments">£ Payments</button>
    <button data-page="invoices">▤ Invoices</button>

    <div class="section">Website & Settings</div>
    <button data-page="website">◈ Website Editor</button>
    <button data-page="pricing">£ Pricing</button>
    <button data-page="about">◎ About Me</button>
    <button data-page="availability">◷ Availability</button>
    <button data-page="terms">§ Terms & Policies</button>
    <button data-page="users">♙ Users</button>
    <button data-page="search">⌕ Global Search</button>
    <button data-page="settings">⚙ Settings</button>
  </nav>
  <div class="side-bottom">
    <button class="btn" style="width:100%" onclick="location.href='/'">View Website</button>
    <button class="btn" style="width:100%;margin-top:7px" onclick="logout()">Sign Out</button>
  </div>
</aside>

<main class="main">
<header class="top">
  <h1 id="pageTitle">Dashboard</h1>
  <div class="identity">
    <span id="identityText">Authenticated</span>
    <div class="avatar" id="avatar">A</div>
  </div>
</header>

<div class="content">

<section id="page-dashboard" class="page active">
  <div class="cards">
    <div class="card"><div class="label">Clients</div><div class="num" id="kpi-clients">—</div></div>
    <div class="card"><div class="label">Premises</div><div class="num" id="kpi-premises">—</div></div>
    <div class="card"><div class="label">Enquiries</div><div class="num" id="kpi-enquiries">—</div></div>
    <div class="card"><div class="label">Quotes</div><div class="num" id="kpi-quotes">—</div></div>
    <div class="card"><div class="label">Bookings</div><div class="num" id="kpi-bookings">—</div></div>
  </div>

  <div class="quick">
    <button onclick="openCreate('enquiry')">+ New Enquiry<span>Create a new enquiry</span></button>
    <button onclick="openCreate('client')">+ New Client<span>Add client record</span></button>
    <button onclick="openCreate('quote')">+ New Quote<span>Create fixed-fee quote</span></button>
    <button onclick="openCreate('booking')">+ New Booking<span>Add site visit</span></button>
  </div>

  <div class="panel">
    <div class="panel-head"><h2>CRM activity</h2><button class="btn small" onclick="loadDashboard()">Refresh</button></div>
    <div id="dashboardActivity" class="empty">Loading…</div>
  </div>
</section>

<section id="page-enquiries" class="page"><div id="generic-enquiries"></div></section>
<section id="page-clients" class="page"><div id="generic-clients"></div></section>
<section id="page-premises" class="page"><div id="generic-premises"></div></section>
<section id="page-quotes" class="page"><div id="generic-quotes"></div></section>
<section id="page-bookings" class="page"><div id="generic-bookings"></div></section>
<section id="page-assessments" class="page"><div id="generic-assessments"></div></section>
<section id="page-previsit" class="page"><div id="generic-previsit"></div></section>
<section id="page-documents" class="page"><div id="generic-documents"></div></section>
<section id="page-actions" class="page"><div id="generic-actions"></div></section>
<section id="page-certificates" class="page"><div id="generic-certificates"></div></section>
<section id="page-messages" class="page"><div id="generic-messages"></div></section>
<section id="page-payments" class="page"><div id="generic-payments"></div></section>
<section id="page-invoices" class="page"><div id="generic-invoices"></div></section>

<section id="page-website" class="page"><div id="generic-website"></div></section>
<section id="page-pricing" class="page"><div id="generic-pricing"></div></section>
<section id="page-about" class="page"><div id="generic-about"></div></section>
<section id="page-availability" class="page"><div id="generic-availability"></div></section>
<section id="page-terms" class="page"><div id="generic-terms"></div></section>
<section id="page-users" class="page"><div id="generic-users"></div></section>
<section id="page-search" class="page"><div id="generic-search"></div></section>
<section id="page-settings" class="page"><div id="generic-settings"></div></section>

</div>
</main>
</div>

<div id="modal" class="modal">
 <div class="modal-box">
  <div class="modal-head"><h2 id="modalTitle">Edit</h2><button class="close" onclick="closeModal()">×</button></div>
  <div class="modal-body" id="modalBody"></div>
 </div>
</div>

<script>
const state={
  page:'dashboard',
  entities:{},
  summary:null,
  content:{},
  currentType:null,
  currentId:null
};

const pageNames={
 dashboard:'Dashboard',
 enquiries:'Enquiries',
 clients:'Clients',
 premises:'Premises',
 quotes:'Quotes',
 bookings:'Bookings',
 assessments:'Assessments',
 previsit:'Pre-Visit',
 documents:'Documents / FRA',
 actions:'Actions',
 certificates:'Certificates',
 messages:'Messages',
 payments:'Payments',
 invoices:'Invoices',
 website:'Website Editor',
 pricing:'Pricing',
 about:'About Me',
 availability:'Availability',
 terms:'Terms & Policies',
 users:'Users',
 search:'Global Search',
 settings:'Settings'
};

const types={
 enquiries:'enquiry',
 clients:'client',
 premises:'premise',
 quotes:'quote',
 bookings:'booking',
 assessments:'assessment',
 previsit:'previsit',
 documents:'document',
 actions:'action',
 certificates:'certificate',
 messages:'message',
 payments:'payment',
 invoices:'invoice',
 website:'website_content',
 pricing:'pricing',
 about:'about',
 availability:'availability',
 terms:'policy',
 users:'user',
 settings:'setting'
};

const labels={
 enquiry:['name','email','phone','company','message','status','source'],
 client:['name','company','email','phone','address','status','notes'],
 premise:['client_id','name','address','postcode','floors','size','occupancy','status','notes'],
 quote:['client_id','premise_id','package','price','status','valid_until','notes'],
 booking:['client_id','premise_id','date','start_time','end_time','status','notes'],
 assessment:['client_id','premise_id','type','assessment_date','status','report_url','notes'],
 previsit:['client_id','premise_id','eicr','gas_certificate','fire_alarm_service','emergency_lighting_service','fire_strategy','status','notes'],
 document:['client_id','premise_id','name','category','url','status','notes'],
 action:['client_id','premise_id','assessment_id','title','description','risk','timescale','due_date','status','notes'],
 certificate:['client_id','premise_id','name','issue_date','expiry_date','url','status','notes'],
 message:['client_id','subject','message','direction','status'],
 payment:['client_id','quote_id','invoice_id','amount','status','payment_date','reference'],
 invoice:['client_id','quote_id','invoice_number','amount','status','issue_date','due_date','paid_date'],
 website_content:['key','title','value','section','published'],
 pricing:['package','price','description','scope','active'],
 about:['name','title','bio','photo_url','email','phone','active'],
 availability:['day','start_time','end_time','enabled','advance_days','notes'],
 policy:['name','version','content','active','required'],
 user:['name','email','role','status'],
 setting:['key','value','description']
};

function esc(v){
 return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function pretty(v){
 if(v===null||v===undefined||v==='') return '—';
 if(typeof v==='object') return JSON.stringify(v);
 return String(v);
}
function titleCase(s){
 return String(s).replace(/[_-]/g,' ').replace(/\b\w/g,x=>x.toUpperCase());
}
function id(){
 return crypto.randomUUID ? crypto.randomUUID() : Date.now()+'-'+Math.random().toString(36).slice(2);
}
function badge(v){
 const x=String(v||'').toLowerCase();
 let cls='';
 if(['paid','complete','completed','active','approved','accepted','low'].includes(x)) cls='green';
 if(['high','overdue','cancelled','archived','rejected'].includes(x)) cls='red';
 if(['medium','pending','awaiting','draft'].includes(x)) cls='amber';
 if(['booked','scheduled','sent','open'].includes(x)) cls='blue';
 return `<span class="badge ${cls}">${esc(v||'—')}</span>`;
}

async function api(url,options={}){
 const res=await fetch(url,{
   credentials:'include',
   headers:{'Content-Type':'application/json',...(options.headers||{})},
   ...options
 });
 if(res.status===401||res.status===403){
   location.href='/assessor';
   throw new Error('Unauthorised');
 }
 const text=await res.text();
 let data={};
 try{data=text?JSON.parse(text):{}}catch{data={raw:text}};
 if(!res.ok) throw new Error(data.error||data.message||`HTTP ${res.status}`);
 return data;
}

async function checkAuth(){
 try{
   const r=await api('/api/auth/me');
   const u=r.user||r;
   if(u){
     const name=u.name||u.email||'Assessor';
     document.getElementById('identityText').textContent=name;
     document.getElementById('avatar').textContent=name.charAt(0).toUpperCase();
   }
 }catch(e){}
}

async function logout(){
 try{await fetch('/api/auth/logout',{method:'POST',credentials:'include'})}catch(e){}
 location.href='/assessor';
}

function switchPage(page){
 state.page=page;
 document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));
 document.getElementById('page-'+page)?.classList.add('active');
 document.querySelectorAll('.nav button').forEach(x=>x.classList.toggle('active',x.dataset.page===page));
 document.getElementById('pageTitle').textContent=pageNames[page]||titleCase(page);
 if(page==='dashboard') loadDashboard();
 else if(page==='search') renderSearch();
 else if(page==='website'||page==='pricing'||page==='about'||page==='availability'||page==='terms'||page==='users'||page==='settings') loadSpecial(page);
 else renderEntityPage(page);
}

document.querySelectorAll('.nav button').forEach(b=>b.addEventListener('click',()=>switchPage(b.dataset.page)));

async function loadDashboard(){
 try{
  const r=await api('/api/admin/crm/summary');
  state.summary=r;
  const counts=r.counts||r.summary||r;
  for(const [id,key] of [
   ['kpi-clients','clients'],['kpi-premises','premises'],['kpi-enquiries','enquiries'],['kpi-quotes','quotes'],['kpi-bookings','bookings']
  ]) document.getElementById(id).textContent=counts[key]??0;
  const activity=r.activity||r.recent||[];
  document.getElementById('dashboardActivity').innerHTML=activity.length?
   `<div class="table-wrap"><table><thead><tr><th>Time</th><th>Action</th><th>Type</th><th>ID</th></tr></thead><tbody>${
    activity.slice(0,20).map(a=>`<tr><td>${esc(a.timestamp||a.created_at||'')}</td><td>${esc(a.action||'')}</td><td>${esc(a.entity_type||a.type||'')}</td><td>${esc(a.entity_id||a.id||'')}</td></tr>`).join('')
   }</tbody></table></div>`:
   '<div class="empty">No activity recorded yet.</div>';
 }catch(e){
  document.getElementById('dashboardActivity').innerHTML=`<div class="empty">${esc(e.message)}</div>`;
 }
}

async function getEntities(type){
 const r=await api('/api/admin/crm/entities/'+encodeURIComponent(type));
 return Array.isArray(r)?r:(r.items||r.entities||r.data||[]);
}

async function renderEntityPage(page){
 const type=types[page];
 const target=document.getElementById('generic-'+page);
 target.innerHTML='<div class="panel"><div class="loading">Loading…</div></div>';
 try{
  const rows=await getEntities(type);
  state.entities[type]=rows;
  target.innerHTML=entityTable(page,type,rows);
 }catch(e){
  target.innerHTML=`<div class="panel"><div class="empty">Unable to load ${esc(page)}: ${esc(e.message)}</div></div>`;
 }
}

function entityTable(page,type,rows){
 const cols=labels[type]||['status','notes'];
 const shown=cols.slice(0,6);
 return `
 <div class="panel">
  <div class="panel-head">
   <div><h2>${esc(pageNames[page])}</h2><div style="font-size:12px;color:var(--muted);margin-top:4px">${rows.length} record(s)</div></div>
   <div class="toolbar">
    <input class="search" placeholder="Filter records…" oninput="filterTable(this,'table-${page}')">
    <button class="btn primary" onclick="openCreate('${type}')">+ New</button>
    <button class="btn" onclick="renderEntityPage('${page}')">Refresh</button>
   </div>
  </div>
  <div class="table-wrap">
  ${rows.length?`
  <table id="table-${page}">
   <thead><tr>${shown.map(c=>`<th>${esc(titleCase(c))}</th>`).join('')}<th>Actions</th></tr></thead>
   <tbody>
   ${rows.map(r=>{
    const d=r.data||r;
    const rid=r.id||d.id||'';
    return `<tr data-search="${esc(JSON.stringify(d).toLowerCase())}">
      ${shown.map(c=>`<td>${c==='status'?badge(d[c]):esc(pretty(d[c]))}</td>`).join('')}
      <td>
       <button class="btn small" onclick="editEntity('${esc(type)}','${esc(rid)}')">Edit</button>
       <button class="btn small" onclick="viewEntity('${esc(type)}','${esc(rid)}')">View</button>
       <button class="btn small" onclick="archiveEntity('${esc(type)}','${esc(rid)}','${esc(page)}')">Archive</button>
      </td>
    </tr>`;
   }).join('')}
   </tbody>
  </table>`:'<div class="empty">No records yet. Use <b>+ New</b> to create the first one.</div>'}
  </div>
 </div>`;
}

function filterTable(input,id){
 const q=input.value.toLowerCase();
 document.querySelectorAll('#'+id+' tbody tr').forEach(tr=>tr.style.display=(tr.dataset.search||'').includes(q)?'':'none');
}

async function viewEntity(type,rid){
 try{
  const r=await api('/api/admin/crm/entity/'+encodeURIComponent(rid));
  const d=r.data||r;
  document.getElementById('modalTitle').textContent=titleCase(type)+' — '+rid;
  document.getElementById('modalBody').innerHTML=`
   <div class="grid2">${Object.entries(d).map(([k,v])=>`
    <div class="field"><label>${esc(titleCase(k))}</label><div style="padding:10px;background:#f7f9fc;border-radius:8px;white-space:pre-wrap">${esc(pretty(v))}</div></div>
   `).join('')}</div>
   <div style="display:flex;justify-content:flex-end;gap:8px">
    <button class="btn" onclick="closeModal()">Close</button>
    <button class="btn primary" onclick="closeModal();editEntity('${esc(type)}','${esc(rid)}')">Edit</button>
   </div>`;
  openModal();
 }catch(e){alert(e.message)}
}

async function editEntity(type,rid){
 try{
  const r=await api('/api/admin/crm/entity/'+encodeURIComponent(rid));
  const d=r.data||r;
  openForm(type,rid,d);
 }catch(e){alert(e.message)}
}

function openCreate(type){
 openForm(type,null,{});
}

function openForm(type,rid,data){
 const fields=labels[type]||['name','status','notes'];
 document.getElementById('modalTitle').textContent=(rid?'Edit ':'New ')+titleCase(type);
 document.getElementById('modalBody').innerHTML=`
  <form id="entityForm" onsubmit="saveEntity(event,'${esc(type)}','${esc(rid||'')}')">
   <div class="grid2">
   ${fields.map(k=>{
    const val=data[k]??'';
    const textarea=['message','description','notes','content','bio','scope'].includes(k);
    const select=k==='status';
    if(select) return `<div class="field"><label>${esc(titleCase(k))}</label><select name="${esc(k)}">
      ${['draft','new','pending','active','approved','accepted','booked','scheduled','open','complete','completed','paid','closed','cancelled','rejected','archived'].map(x=>`<option ${String(val)===x?'selected':''}>${x}</option>`).join('')}
    </select></div>`;
    if(k==='risk') return `<div class="field"><label>Risk</label><select name="risk">${['Low','Medium','High'].map(x=>`<option ${String(val).toLowerCase()===x.toLowerCase()?'selected':''}>${x}</option>`).join('')}</select></div>`;
    if(k==='package') return `<div class="field"><label>Package</label><select name="package">${['Small','Standard','Larger','Complex'].map(x=>`<option ${String(val)===x?'selected':''}>${x}</option>`).join('')}</select></div>`;
    if(k==='price'||k==='amount') return `<div class="field"><label>${esc(titleCase(k))}</label><input name="${esc(k)}" type="number" step="0.01" value="${esc(val)}"></div>`;
    if(k==='enabled'||k==='active'||k==='published') return `<div class="field"><label>${esc(titleCase(k))}</label><select name="${esc(k)}"><option value="true" ${String(val)!=='false'?'selected':''}>Yes</option><option value="false" ${String(val)==='false'?'selected':''}>No</option></select></div>`;
    if(k.includes('date')) return `<div class="field"><label>${esc(titleCase(k))}</label><input name="${esc(k)}" type="date" value="${esc(val)}"></div>`;
    if(k.includes('time')) return `<div class="field"><label>${esc(titleCase(k))}</label><input name="${esc(k)}" type="time" value="${esc(val)}"></div>`;
    if(textarea) return `<div class="field" style="grid-column:1/-1"><label>${esc(titleCase(k))}</label><textarea name="${esc(k)}">${esc(val)}</textarea></div>`;
    return `<div class="field"><label>${esc(titleCase(k))}</label><input name="${esc(k)}" value="${esc(val)}"></div>`;
   }).join('')}
   </div>
   <div style="display:flex;justify-content:flex-end;gap:8px">
    <button type="button" class="btn" onclick="closeModal()">Cancel</button>
    <button class="btn primary">${rid?'Save Changes':'Create Record'}</button>
   </div>
  </form>`;
 openModal();
}

async function saveEntity(ev,type,rid){
 ev.preventDefault();
 const form=ev.target;
 const data={};
 [...form.elements].forEach(el=>{if(el.name)data[el.name]=el.value});
 try{
  if(rid){
   await api('/api/admin/crm/entity/'+encodeURIComponent(rid),{method:'PUT',body:JSON.stringify(data)});
  }else{
   if(!data.id)data.id=id();
   await api('/api/admin/crm/entities/'+encodeURIComponent(type),{method:'POST',body:JSON.stringify(data)});
  }
  closeModal();
  if(state.page==='dashboard') loadDashboard();
  else renderEntityPage(state.page);
 }catch(e){alert('Save failed: '+e.message)}
}

async function archiveEntity(type,rid,page){
 if(!confirm('Archive this record?'))return;
 try{
  await api('/api/admin/crm/entity/'+encodeURIComponent(rid),{method:'DELETE'});
  renderEntityPage(page);
 }catch(e){alert(e.message)}
}

async function loadSpecial(page){
 const type=types[page];
 const target=document.getElementById('generic-'+page);
 target.innerHTML='<div class="panel"><div class="loading">Loading…</div></div>';
 try{
  const r=await api('/api/admin/crm/content');
  state.content=r.content||r||{};
 }catch(e){}
 if(page==='pricing') renderPricing(target);
 else if(page==='about') renderAbout(target);
 else if(page==='website') renderWebsite(target);
 else if(page==='availability') renderAvailability(target);
 else if(page==='terms') renderTerms(target);
 else if(page==='users') renderEntityPage(page);
 else if(page==='settings') renderSettings(target);
}

  </div>
  <div id="searchResults"></div>

async function globalSearch(){
 const q=document.getElementById('globalQuery').value.trim();
 if(!q)return;
 const out=document.getElementById('searchResults');
 out.innerHTML='<div class="loading">Searching…</div>';
 try{
  const r=await api('/api/admin/crm/search?q='+encodeURIComponent(q));
  const rows=r.results||r.items||r.data||r||[];
  out.innerHTML=Array.isArray(rows)&&rows.length?
   `<div class="table-wrap"><table><thead><tr><th>Type</th><th>ID</th><th>Details</th><th></th></tr></thead><tbody>${
    rows.map(x=>`<tr><td>${esc(x.type||x.entity_type||'')}</td><td>${esc(x.id||x.entity_id||'')}</td><td>${esc(pretty(x.data||x))}</td><td>${x.id?`<button class="btn small" onclick="viewEntity('${esc(x.type||x.entity_type||'')}','${esc(x.id)}')">View</button>`:''}</td></tr>`).join('')
   }</tbody></table></div>`:
   '<div class="empty">No matching records.</div>';
 }catch(e){out.innerHTML=`<div class="empty">${esc(e.message)}</div>`}
}
